server {
    listen 8080;
    listen 80;
    server_name app.rollercoaster.com angular localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security & Search Engine Indexing Suppression Headers
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://app.rollercoaster.com wss://app.rollercoaster.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Public JSON Schema Contracts (/schemas Volume)
    location /schemas/ {
        alias /schemas/;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://app.rollercoaster.com wss://app.rollercoaster.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri $uri/ =404;
    }

    # Internal Reverse Proxy for REST API (Playwright Headless Print Worker & SPA)
    location /api/ {
        proxy_pass http://spring-boot:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Internal Reverse Proxy for STOMP WebSockets
    location /ws/ {
        proxy_pass http://spring-boot:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Static WOFF2 Typography & Geo Assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://app.rollercoaster.com wss://app.rollercoaster.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    # Angular HTML5 pushState Single Page Application Catch-All
    location / {
        try_files $uri $uri/ /index.html;
    }
}
